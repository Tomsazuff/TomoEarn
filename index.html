<video id="video" controls autoplay muted loop playsinline style="width:100%;height:100vh;object-fit:cover">
  <source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>
<div id="timer" style="position:fixed;top:10px;right:10px;background:black;color:white;padding:10px;border-radius:20px;z-index:99">Reklama o: 10s</div>

<div id="ad" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;color:white;z-index:100;justify-content:center;align-items:center;flex-direction:column">
  <h1>REKLAMA <span id="count">5</span>s</h1>
  <p>Tvoja Adsterra</p>
</div>

<script data-cfasync="false" src="https://dcengg.org/14/02cf388361c74f70e93f783141145e41"></script>
<script data-cfasync="false" src="https://4xfreedom.com/1/6737b60ec7b55d7069e555ef42e4e4b3"></script>

<script>
let t=0;
setInterval(()=>{
  t++;
  document.getElementById('timer').innerText='Reklama o: '+(10-t)+'s';
  if(t==10){
    document.getElementById('video').pause();
    document.getElementById('ad').style.display='flex';
    let c=5;
    setInterval(()=>{
      c--;
      document.getElementById('count').innerText=c;
      if(c==0){
        document.getElementById('ad').style.display='none';
        document.getElementById('video').play();
      }
    },1000);
  }
},1000);
</script>
