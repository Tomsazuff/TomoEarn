<!DOCTYPE html>
<html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TomoEarn V2</title>
<style>body{background:#0f0f0f;color:#fff;font-family:Arial;text-align:center;padding:20px}.box{background:#1e1e1e;border-radius:15px;padding:20px;max-width:400px;margin:20px auto;border:1px solid #333}.timer{font-size:48px;color:#00ff88}.btn{background:#00ff88;color:#000;border:none;padding:18px 30px;border-radius:10px;font-size:20px;font-weight:bold;width:100%}.btn:disabled{background:#555}.earn{font-size:24px;color:#ffd700}</style></head>
<body><h1>🔥 TomoEarn V2 - 1$ Denne</h1><div class="box"><div>ZÁROBOK:</div><div class="earn" id="earn">$0.00</div><div id="clicks">Klikov: 0/50</div></div><div class="box"><div id="status">Pripravený</div><div class="timer" id="timer">15:00</div><button class="btn" id="btn" onclick="openAd()">OTVOR REKLAMU +$0.02</button></div>
<script>
const AD_LINK="https://asiafilm.org/4/e0de4311ee957402b2609c6f6d8c3fb5";
let clicks=parseInt(localStorage.getItem('tomo_clicks')||'0');let earn=parseFloat(localStorage.getItem('tomo_earn')||'0');let timeLeft=0;
function updateUI(){document.getElementById('earn').innerText='$'+earn.toFixed(2);document.getElementById('clicks').innerText='Klikov: '+clicks+' / 50';}
function startTimer(){timeLeft=900;let i=setInterval(()=>{timeLeft--;let m=Math.floor(timeLeft/60);let s=timeLeft%60;document.getElementById('timer').innerText=m+':'+(s<10?'0':'')+s;document.getElementById('status').innerText='⏳ Čakám 15 min...';document.getElementById('btn').disabled=true;if(timeLeft<=0){clearInterval(i);document.getElementById('timer').innerText='PRIPRAVENÝ';document.getElementById('status').innerText='✅ Klikni znova!';document.getElementById('btn').disabled=false;}},1000);}
function openAd(){window.open(AD_LINK,'_blank');clicks++;earn+=0.02;localStorage.setItem('tomo_clicks',clicks);localStorage.setItem('tomo_earn',earn);updateUI();startTimer();}
updateUI();
</script></body></html>
