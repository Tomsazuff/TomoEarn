<script>
// REEL REKLAMA LOGIKA - 10s potom 5s reklama
let timeWatched = 0;
let adShown = false;

setInterval(() => {
  if (!adShown) {
    timeWatched++;
    console.log("Pozerá: " + timeWatched + "s");
    
    if (timeWatched == 10) {
      // PAUZA VIDEO + UKÁŽ REKLAMU NA 5s
      document.getElementById('video').pause();
      document.getElementById('ad-overlay').style.display = 'flex';
      
      let adTime = 5;
      let adTimer = setInterval(() => {
        document.getElementById('ad-count').innerText = adTime;
        adTime--;
        if (adTime < 0) {
          clearInterval(adTimer);
          document.getElementById('ad-overlay').style.display = 'none';
          document.getElementById('video').play();
        }
      }, 1000);
      
      adShown = true;
    }
  }
}, 1000);
</script>

<!-- REKLAMA OVERLAY - 5 sekund -->
<div id="ad-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column;">
  <p style="color:white; font-size:20px;">REKLAMA <span id="ad-count">5</span>s</p>
  <div id="ad-container" style="background:white; padding:20px; border-radius:10px; width:90%; max-width:300px; text-align:center;">
    🔥 TOP ponuka - čakaj 5 sekúnd
    <!-- tu sa načíta Social Bar reklama -->
  </div>
</div>
