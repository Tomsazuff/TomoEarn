let realEarnTotal = Number(localStorage.getItem('real_earn')||0);

const SUPABASE_KEY="sb_publishable_j95JBEVTQIsqp10TiGymSQ_wZVI4ADB";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,running=false,freeVideoPool=[],videosWatched=0;
const urlParams=new URLSearchParams(window.location.search); const incomingReferral=urlParams.get("ref");
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function showMessage(t){document.getElementById("message").textContent=t}
function setBalance(v){document.getElementById("balance").textContent="$"+Number(v||0).toFixed(4)}
function updateRealEarn(){ document.getElementById("realEarn").textContent="$"+realEarnTotal.toFixed(3); localStorage.setItem('real_earn', realEarnTotal); }
async function fetch1000(force=false){
 const cached=localStorage.getItem('tomo_1000_pool'); const cachedAt=Number(localStorage.getItem('tomo_1000_pool_at')||0);
 if(!force && cached && (Date.now()-cachedAt)<86400000){ try{ const p=JSON.parse(cached); if(p.length>=20){ freeVideoPool=p.map(v=>({...v,reward:REWARD})); updatePoolInfo(); return freeVideoPool; } }catch(e){} }
 let all=[]; try{ const {data,error}=await client.functions.invoke("pixabay-videos",{body:{count:200}}); if(!error&&data&&data.videos) all=data.videos; }catch(e){}
 if(all.length<20){ for(let i=0;i<1000;i++) all.push({id:"fb"+i,video_url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",title:"Viral #"+(i+1)}); }

async function login(){ const email=document.getElementById("email").value.trim(); const password=document.getElementById("password").value; const {data,error}=await client.auth.signInWithPassword({email,password}); if(error){showMessage(error.message); return} currentUser=data.user; await loadUser(); }
async function loadUser(){
 const {data}=await client.auth.getUser(); currentUser=data.user; if(!currentUser){ document.getElementById("authBox").classList.remove("hidden"); document.getElementById("app").classList.add("hidden"); return; }
 document.getElementById("authBox").classList.add("hidden"); document.getElementById("app").classList.remove("hidden"); document.getElementById("userEmail").textContent=currentUser.email; updateRealEarn();
 try{ const {data:p}=await client.from("profiles").select("*").eq("id",currentUser.id).maybeSingle(); if(p) setBalance(p.balance); }catch(e){}

}

async function runNext(){

 let t=15; while(t>0 && running){ const el=document.getElementById("vTimer"); const pr=document.getElementById("vProg"); if(el) el.textContent=t; if(pr) pr.style.width=((15-t)/15*100)+"%"; await sleep(1000); t--; }
 if(!running) return; videosWatched++; if(videosWatched % 5 == 0){ await triggerMonetagAd(); }
 if(currentUser){ try{ const {data:profile}=await client.from("profiles").select("balance").eq("id",currentUser.id).maybeSingle(); const newBal=(Number(profile?.balance||0)+REWARD); await client.from("profiles").update({balance:newBal}).eq("id",currentUser.id); setBalance(newBal); }catch(e){} }
 if(running) { await sleep(1500); runNext(); }
}

(async function(){ const {data}=await client.auth.getSession(); if(data?.session?.user){ currentUser=data.session.user; await loadUser(); } updateRealEarn(); })();
