<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TomoEarn</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0f14;
    color:#fff;
}

header{
    padding:20px;
    background:#111821;
    border-bottom:1px solid #26313d;
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#35d07f;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.card{
    background:#111821;
    border:1px solid #26313d;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

.balance{
    background:linear-gradient(135deg,#15241d,#102018);
    border:1px solid #24563b;
    border-radius:18px;
    padding:25px;
    text-align:center;
    margin-bottom:20px;
}

.balance-title{
    color:#aab5bf;
    font-size:14px;
}

.balance-value{
    font-size:38px;
    font-weight:bold;
    margin-top:8px;
}

input{
    width:100%;
    padding:15px;
    margin:7px 0;
    border-radius:12px;
    border:1px solid #354453;
    background:#18212b;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    margin-top:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#35d07f;
    color:#06100a;
}

.secondary{
    background:#202b36;
    color:white;
    border:1px solid #354453;
}

.task{
    background:#18212b;
    border-radius:14px;
    padding:18px;
    text-align:center;
    margin-top:12px;
}

.task-title{
    font-size:18px;
    font-weight:bold;
}

.task-info{
    color:#aab5bf;
    font-size:14px;
    margin:8px 0;
}

.timer{
    font-size:34px;
    font-weight:bold;
    color:#35d07f;
    margin:15px 0;
}

.progress{
    width:100%;
    height:8px;
    background:#26313d;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#35d07f;
    transition:width 1s linear;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.stat{
    background:#18212b;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.stat-number{
    font-size:20px;
    font-weight:bold;
}

.stat-label{
    color:#8e9aa5;
    font-size:12px;
    margin-top:5px;
}

.hidden{
    display:none;
}

.message{
    padding:12px;
    border-radius:10px;
    margin-bottom:12px;
    background:#18212b;
    color:#aab5bf;
    font-size:14px;
}

.logout{
    margin-top:10px;
}

.note{
    color:#7f8b96;
    font-size:12px;
    line-height:1.5;
    text-align:center;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Tomo<span>Earn</span></div>
</header>

<div class="container">

    <!-- LOGIN -->
    <div class="card" id="authBox">

        <h2>Login / Register</h2>

        <div id="message" class="message">
            Prihlás sa alebo vytvor nový účet.
        </div>

        <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Heslo"
            autocomplete="current-password"
        >

        <button class="primary" onclick="login()">
            PRIHLÁSIŤ
        </button>

        <button class="secondary" onclick="register()">
            VYTVORIŤ ÚČET
        </button>

    </div>


    <!-- APP -->
    <div id="app" class="hidden">

        <div class="balance">

            <div class="balance-title">
                YOUR BALANCE
            </div>

            <div class="balance-value" id="balance">
                $0.0000
            </div>

        </div>


        <div class="card">

            <h2>Watch & Earn</h2>

            <div id="taskList">
                Načítavam úlohy...
            </div>

        </div>


        <div class="card">

            <h2>Statistics</h2>

            <div class="stats">

                <div class="stat">

                    <div class="stat-number" id="tasks">
                        0
                    </div>

                    <div class="stat-label">
                        COMPLETED TASKS
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-number" id="earned">
                        $0.0000
                    </div>

                    <div class="stat-label">
                        TOTAL EARNED
                    </div>

                </div>

            </div>

        </div>


        <div class="card">

            <h2>Withdraw</h2>

            <div class="task-info">
                Dostupné výplaty: USDT / BTC
            </div>

            <button class="secondary" onclick="withdraw()">
                WITHDRAW
            </button>

        </div>


        <div class="card">

            <h2>Account</h2>

            <div class="task-info" id="userEmail">
                -
            </div>

            <div class="task-info" id="referral">
                Referral: -
            </div>

            <button class="secondary logout" onclick="logout()">
                ODHLÁSIŤ
            </button>

        </div>

    </div>


    <div class="note">
        TomoEarn — powered by Supabase.
    </div>

</div>


<script>

const SUPABASE_URL =
"https://irfrtnzetkejbdaihmmo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_j95JBEVTQIsqp10TiGymSQ_wZVI4ADB";

const client =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;
let currentTask = null;
let taskRunning = false;


/* -------------------------
   MESSAGE
------------------------- */

function message(text){

    document.getElementById("message").textContent = text;

}


/* -------------------------
   REGISTER
------------------------- */

async function register(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if(!email || !password){

        message("Vyplň email a heslo.");
        return;

    }

    if(password.length < 6){

        message("Heslo musí mať minimálne 6 znakov.");
        return;

    }

    const {data,error} =
        await client.auth.signUp({
            email:email,
            password:password
        });

    if(error){

        message(error.message);
        return;

    }

    message(
        "Účet bol vytvorený. Ak Supabase vyžaduje potvrdenie emailu, potvrď ho."
    );

}


/* -------------------------
   LOGIN
------------------------- */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if(!email || !password){

        message("Vyplň email a heslo.");
        return;

    }

    const {data,error} =
        await client.auth.signInWithPassword({
            email:email,
            password:password
        });

    if(error){

        message(error.message);
        return;

    }

    await loadUser();

}


/* -------------------------
   LOAD USER
------------------------- */

async function loadUser(){

    const {data} =
        await client.auth.getUser();

    currentUser =
        data.user;

    if(!currentUser){

        document
        .getElementById("authBox")
        .classList.remove("hidden");

        document
        .getElementById("app")
        .classList.add("hidden");

        return;

    }

    document
    .getElementById("authBox")
    .classList.add("hidden");

    document
    .getElementById("app")
    .classList.remove("hidden");

    document
    .getElementById("userEmail")
    .textContent =
        currentUser.email || "";

    await loadProfile();

    await loadTasks();

}


/* -------------------------
   PROFILE
------------------------- */

async function loadProfile(){

    const {data,error} =
        await client
        .from("profiles")
        .select("balance,referral_code")
        .eq("id",currentUser.id)
        .maybeSingle();

    if(error){

        console.log(error);
        return;

    }

    if(!data){

        return;

    }

    const balance =
        Number(data.balance || 0);

    document
    .getElementById("balance")
    .textContent =
        "$" + balance.toFixed(4);

    document
    .getElementById("earned")
    .textContent =
        "$" + balance.toFixed(4);

    document
    .getElementById("referral")
    .textContent =
        "Referral: " +
        (data.referral_code || "-");

}


/* -------------------------
   TASKS
------------------------- */

async function loadTasks(){

    const {data,error} =
        await client
        .from("tasks")
        .select("*")
        .eq("active",true)
        .order("id");

    const list =
        document.getElementById("taskList");

    if(error){

        list.innerHTML =
            "<div class='task-info'>Úlohy sa nepodarilo načítať.</div>";

        console.log(error);

        return;

    }

    if(!data || data.length === 0){

        list.innerHTML =
            "<div class='task'>"+
            "<div class='task-title'>No tasks available</div>"+
            "<div class='task-info'>"+
            "Momentálne nie sú dostupné žiadne úlohy."
            +"</div></div>";

        return;

    }

    list.innerHTML = "";

    data.forEach(task => {

        const box =
            document.createElement("div");

        box.className = "task";

        box.innerHTML =

            "<div class='task-title'>" +
            escapeHtml(task.title) +
            "</div>" +

            "<div class='task-info'>" +
            "Čas: " +
            task.duration_seconds +
            " s · Odmena: $" +
            Number(task.reward).toFixed(4) +
            "</div>" +

            "<button class='primary' "+
            "onclick='startTask(" +
            task.id +
            ")'>LAUNCH</button>";

        list.appendChild(box);

    });

}


/* -------------------------
   START TASK
------------------------- */

async function startTask(taskId){

    if(taskRunning){

        return;

    }

    const {data,error} =
        await client
        .from("tasks")
        .select("*")
        .eq("id",taskId)
        .eq("active",true)
        .maybeSingle();

    if(error || !data){

        alert("Úloha už nie je dostupná.");
        return;

    }

    currentTask =
        data;

    taskRunning = true;

    const seconds =
        Number(data.duration_seconds);

    let remaining =
        seconds;

    const box =
        document.createElement("div");

    box.className =
        "task";

    box.id =
        "runningTask";

    box.innerHTML =

        "<div class='task-title'>" +
        escapeHtml(data.title) +
        "</div>" +

        "<div class='timer' id='taskTimer'>" +
        remaining +
        "</div>" +

        "<div class='progress'>" +
        "<div class='progress-bar' id='taskProgress'></div>" +
        "</div>" +

        "<div class='task-info' id='taskStatus'>" +
        "Úloha prebieha..."
        +"</div>";

    document
    .getElementById("taskList")
    .prepend(box);


    const {error:startError} =
        await client
        .from("task_completions")
        .insert({
            user_id:currentUser.id,
            task_id:data.id,
            status:"started"
        });

    if(startError){

        console.log(startError);

    }


    const interval =
        setInterval(async () => {

            remaining--;

            const timer =
                document.getElementById("taskTimer");

            const progress =
                document.getElementById("taskProgress");

            if(timer){

                timer.textContent =
                    remaining;
            }

            if(progress){

                const done =
                    ((seconds - remaining) / seconds) * 100;

                progress.style.width =
                    done + "%";
            }


            if(remaining <= 0){

                clearInterval(interval);

                if(timer){

                    timer.textContent = "✓";
                }

                if(progress){

                    progress.style.width = "100%";
                }

                const status =
                    document.getElementById("taskStatus");

                if(status){

                    status.textContent =
                        "Úloha dokončená. Odmena sa spracuje serverom.";
                }

                taskRunning = false;

                /*
                  DÔLEŽITÉ:
                  Zatiaľ tu úmyselne nepridávame peniaze
                  priamo z prehliadača.

                  Ďalším krokom bude bezpečná Supabase
                  funkcia, ktorá overí dokončenie a až potom
                  pripíše skutočnú odmenu.
                */
            }

        },1000);

}


/* -------------------------
   WITHDRAW
------------------------- */

function withdraw(){

    alert(
        "Výbery USDT/BTC pripojíme po dokončení bezpečného payout systému."
    );

}


/* -------------------------
   LOGOUT
------------------------- */

async function logout(){

    await client.auth.signOut();

    currentUser =
        null;

    document
    .getElementById("app")
    .classList.add("hidden");

    document
    .getElementById("authBox")
    .classList.remove("hidden");

}


/* -------------------------
   HTML ESCAPE
------------------------- */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* -------------------------
   SESSION
------------------------- */

client.auth.onAuthStateChange(
    async (event,session) => {

        if(session){

            await loadUser();

        }

    }
);


/* -------------------------
   START
------------------------- */

loadUser();

</script>

</body>
</html>
