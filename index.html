<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="monetag" content="3528087">
<title>TomoEarn</title>
<style>
body{background:#111;color:#fff;text-align:center;font-family:Arial;padding:20px}
.box{max-width:400px;margin:50px auto;background:#222;padding:25px;border-radius:15px}
h1{color:#00ff88}
button{background:#00ff88;color:#000;border:0;padding:15px;width:100%;border-radius:10px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h1>TomoEarn</h1>
<p>Claim 0.0005 TOMO kazdych 5 minut</p>
<div id="timer" style="font-size:22px;color:#00ff88;margin:15px">Ready!</div>
<button id="btn" onclick="claim()">CLAIM NOW</button>
<p>Balance: <span id="bal">0.00000000</span></p>
</div>
<script>
let bal=parseFloat(localStorage.getItem('bal')||0);
let last=parseInt(localStorage.getItem('last')||0);
document.getElementById('bal').innerText=bal.toFixed(8);
function upd(){
 let now=Date.now();
 let diff=300000-(now-last);
 if(diff<=0){document.getElementById('timer').innerText='Ready!';document.getElementById('btn').disabled=false}
 else{let s=Math.floor(diff/1000);document.getElementById('timer').innerText=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');document.getElementById('btn').disabled=true}
}
function claim(){bal+=0.0005;last=Date.now();localStorage.setItem('bal',bal);localStorage.setItem('last',last);document.getElementById('bal').innerText=bal.toFixed(8);upd()}
setInterval(upd,1000);upd();
</script>
</body>
</html>
